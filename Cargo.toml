[package]
name = "akibiyori"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Generate readable Cobalt source from OpenAPI contracts and authored Markdown"
license = "MIT"

[dependencies]
ammonia = "=4.2.4"
clap = { version = "4.6.7", features = ["derive"] }
pulldown-cmark = "=0.13.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
syntect = { version = "=5.2.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.21"
percent-encoding = "=2.3.2"
url = "=2.5.8"
yaml-rust2 = "=0.13.0"

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.27.0"

[[bin]]
name = "akibiyori"
path = "src/main.rs"
