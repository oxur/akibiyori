[package]
name = "akibiyori"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Generate readable Cobalt source from OpenAPI contracts and authored Markdown"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
sha2 = "0.10.9"
tempfile = "3.27.0"

[[bin]]
name = "akibiyori"
path = "src/main.rs"
